# EXAMPLE graph. All channel and playlist ids below are placeholders; replace them with your own.
version: 1
settings:
  # "all": file into every matching destination.
  # "first": stop at the first destination reached; edge targets are visited in lexicographic node-id order.
  multi_match: all
  # Reserved node types (filter.llm, router.llm) validate, but a graph containing one fails at run time
  # with "not implemented in this version", even if the node is unreachable. Do not add them yet.
nodes:
  - id: cooking_channels
    type: source.channel_group
    params:
      channel_ids:
        - UCexample000000000000001   # EXAMPLE channel id
        - UCexample000000000000002   # EXAMPLE channel id
  - id: no_shorts
    type: filter.shorts
    params: {mode: exclude}
  - id: no_live
    type: filter.live
  - id: recipes
    type: filter.keyword
    params:
      include: [recipe, baking]
      exclude: [sponsored]
      fields: [title, tags]
  - id: recent
    type: filter.age
    params: {max_days: 7}
  - id: cooking_playlist
    type: destination.playlist
    params:
      playlist_id: PLexampleExamplePlaylist01   # EXAMPLE playlist id
      title: Cooking
edges:
  - {from: cooking_channels, to: no_shorts}
  - {from: no_shorts, to: no_live}
  - {from: no_live, to: recent}
  - {from: recent, to: recipes}
  - {from: recipes, to: cooking_playlist}
